# Retrieval behaviour. All values overridable per request; the resolved config is
# hashed and recorded in every result file and every /search response.

default_mode: hybrid
top_k: 5

dense:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  prefetch_limit: 50
  vector_name: dense

sparse:
  vector_name: bm25
  prefetch_limit: 50
  modifier: IDF          # Qdrant computes IDF server-side over the live corpus
  hash_bits: 32

fusion:
  method: weighted       # rrf | weighted | dbsf
  k: 60                  # RRF smoothing constant (tune on dev)
  weights: {dense: 1.0, sparse: 0.1}

rerank:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  candidates: 30

budget:
  latency_budget_ms: 250

cache:
  enabled: true
  maxsize: 4096
  semantic_threshold: 0.95

answering:
  evidence_threshold: null   # calibrate on the dev split; null = use top-1 score heuristic
  max_passages: 5
